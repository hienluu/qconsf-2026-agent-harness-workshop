[project]
name = "agent-harness-workshop"
version = "0.1.0"
description = "Hands-on repo for the QCon SF 2026 workshop: Choosing the Right Agent Harness"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pytest>=8",
    "rich>=13",
    "python-dotenv>=1",
]

[tool.uv]
package = false

[dependency-groups]
block4 = [
    "claude-agent-sdk>=0.2.152",
    "deepagents>=0.7.13",
    # ADK reaches non-Google models through LiteLLM. LiteLLM 1.84+ requires
    # openai<3 and openai-agents requires openai>=3, so the resolver holds
    # LiteLLM at 1.83.0, the last release without that limit. Install it
    # directly: google-adk[extensions] requires LiteLLM 1.84+ and would put
    # ADK and openai-agents back in conflict (and is 161 packages vs 75).
    "google-adk>=2.8",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "litellm>=1.83.0",
    "openai-agents>=0.22.0",
    "pydantic-ai>=2.31.1",
]
