[project]
name = "agent-harness-workshop"
version = "0.1.0"
description = "Hands-on repo for the QCon SF 2026 workshop: Choosing the Right Agent Harness"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pytest>=8",
    "rich>=13",
    "python-dotenv>=1",
]

[tool.uv]
package = false
# The five production harnesses cannot share one dependency resolution:
# google-adk[extensions] (LiteLLM) conflicts with openai-agents. Ecosystem
# fragmentation, made tangible — ADK runs from its own group:
#   uv run --group block4 <specimen>          (four of five)
#   uv run --group block4-adk google_adk/run.py
conflicts = [[{ group = "block4" }, { group = "block4-adk" }]]

[dependency-groups]
block4-adk = [
    "google-adk[extensions]>=2.8",
    "python-dotenv>=1",
    "pytest>=8",
]
block4 = [
    "claude-agent-sdk>=0.2.152",
    "deepagents>=0.7.13",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai-agents>=0.22.0",
    "pydantic-ai>=2.31.1",
]
